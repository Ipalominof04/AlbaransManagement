<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Login - Gestió d’Albarans</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #dfe6ee);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 520px;
            margin: 60px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2c3e50;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .error {
            color: #c0392b;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .back {
            margin-top: 25px;
            text-align: center;
        }

        .back a {
            color: #2980b9;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🧑‍💼 Login d’Empleat</h1>
    <p>Accés al sistema de Gestió d’Albarans</p>

    {% if form.errors %}
        <div class="error">
            Revisa les dades del formulari
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <!-- Dades d'usuari -->
        <label>Email</label>
        {{ form.email }}

        <label>Contrasenya</label>
        {{ form.password }}

        <button type="submit">Iniciar session</button>
    </form>

</div>

</body>
</html>
