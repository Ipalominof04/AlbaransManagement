<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
        }

        h1 {
            color: #2c3e50;
        }

        /* Botons */
        a.button,
        button.button {
            display: inline-block;
            padding: 10px 18px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }

        a.button:hover,
        button.button:hover {
            background: #2980b9;
        }

        a.button.secondary {
            background: #2980b9;
        }

        a.button.secondary:hover {
            background: #707b7c;
        }

        form {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        .actions {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <p>
        <a href="{% url 'ClientsAlbarans:inici' %}" class="button secondary">
            🏠 Inici
        </a>
    </p>

    <h1>{{ titol }}</h1>

    <form method="post">
        {% csrf_token %}
         <label for="numero_albara">Número de albarán</label>
         <input type="number" name="numero_albara" id="numero_albara" required>
        <div class="actions">
            <button type="submit" class="button">
                🔍 buscar
            </button>

            <a href="{% url 'ClientsAlbarans:inici' %}" class="button secondary">
                ← Tornar
            </a>
        </div>
    </form>

</body>
</html>
